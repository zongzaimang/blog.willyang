encoding: utf-8

plugins:
  - jekyll-regex-replace

# SEO相关信息
title: WillYang Blog
description: Will Yang 的个人博客
keywords: WillYang,Blog,Java,Html,JavaScript
author: Will Yang
footerText: '©2026 Will Yang. All Rights Reserved'

# 这些不要动
permalink: /posts/:year/:month/:day/:title.html
short_post_urls: true
kramdown:
  auto_ids: true
  input: GFM
  syntax_highlighter: rouge
exclude:
  - CNAME
  - README.md
  - LICENSE
  - _site
  - dist
  - vendor
  - Gemfile
  - Gemfile.lock
  - blog.sh
  - tools
  - service-worker.js
  - 'Pasted image 20260917104537.png'
  - static/font
  - static/img/logo.png
  - static/img/logo.jpg
  - static/img/favicon.ico
  - static/img/icon-theme-light.svg
  - static/img/icon-theme-dark.svg
  - static/img/icon-loading.svg
  - static/img/icon-arrow-top.svg
  - static/img/jetbrains.svg
  - static/img/wy-angular-v3.png
  - static/img/wy-monogram-v1.png
  - static/img/wy-separated-v2.png

# 域名配置
# baseurl配置,如果网站部署在根目录下的其他目录中，请设置为 /目录名
domainUrl: 'https://blog.willyang.space'
baseurl: ''

# 留言板链接，在新标签页打开
tucaoUrl: https://support.qq.com/product/669023

# 菜单
# 必填字段 title: '文本' url: '链接'
# 可选字段 target: '_blank' 新页面打开 
menu:
  - title: 首页
    url: /
  - title: 归类
    url: /pages/categories.html
  - title: 搜索
    url: /pages/search.html
  - title: 友链
    url: /pages/links.html
  - title: 留言
    url: /pages/chat.html
  - title: 关于
    url: /pages/about.html


# Google Adsense,不需要请设置为false
# _includes/ext-adsense.html 里面修改为自己的配置
extAdsense: false

# 数学公式支持，比较影响加载速度,不需要请设置为false
extMath: false

# 显示访问量统计，由不蒜子提供服务
extCount: false

# 友情链接
links:
  - title: Tmaize
    url: https://blog.tmaize.net/
  - title: Py's Whisper
    url: https://whisper.pyliubaolin.top
  - title: Yuyao's Blog
  - title: 咕咚同学
    url: https://gudong.site
  - title: Chemcat Blog
    url: https://chemcat.gitee.io
  - title: 大葱博客
    url: https://blog.zzzdc.com/
