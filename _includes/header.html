<a class="skip-link" href="#main-content">跳转到主要内容</a>
<header class="header">
  <a href="{{ site.baseurl }}/" class="brand" aria-label="{{ site.title | escape }} 首页">
    <span class="brand-mark" aria-hidden="true"></span>
  </a>
  <nav class="menu" id="site-menu" aria-label="主导航">
    {% for menu in site.menu %}
      {% assign href = menu.url %}
      {% unless href contains '://' %}{% assign href = site.baseurl | append: menu.url %}{% endunless %}
      {% assign menu_current_url = menu.url | remove: '.html' %}
      <a href="{{href}}"{% if menu.target %} target="{{menu.target}}" rel="noopener noreferrer"{% endif %}{% if page.url == menu_current_url %} aria-current="page"{% endif %}>{{ menu.title | escape }}</a>
    {% endfor %}
  </nav>
  <button class="theme-toggle icon-button" type="button" hidden>
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8a8.5 8.5 0 1 0 11.5 11.5Z"/></svg>
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.2v2M12 19.8v2M2.2 12h2M19.8 12h2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"/></svg>
  </button>
  <button class="menu-toggle icon-button" type="button" aria-controls="site-menu" aria-expanded="false" aria-label="打开导航菜单">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>
