name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Test post filename compatibility
        run: bundle exec ruby _tests/short_post_urls_test.rb

      - name: Test cache invalidation
        run: bundle exec ruby _tests/asset_versions_test.rb

      - name: Test image rendering
        run: bundle exec ruby _tests/reading_images_test.rb

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site

      - name: Validate published pages, resources and feeds
        run: bundle exec ruby _tests/published_site_test.rb _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
